# General settings
general_settings:
  # Master key for authentication
  master_key: os.environ/LITELLM_MASTER_KEY

  # Database connection for virtual keys
  database_url: os.environ/DATABASE_URL

  # Logging
  log_level: INFO

  # Request timeout in seconds
  request_timeout: 600

  # Enable detailed logging
  set_verbose: false

  # Cache settings (optional)
  cache: false

  # Enable model fallbacks
  enable_fallbacks: true

# Router settings
router_settings:
  routing_strategy: simple-shuffle

  # Rate limiting (requests per minute per model)
  rpm_limit: 100

  # Cooldown time after rate limit in seconds
  cooldown_time: 60

# Global LiteLLM SDK settings
litellm_settings:
  # Silently drop request params a model doesn't support (e.g. reasoning_effort
  # on gemini/grok/kimi/mai-code) instead of failing the call with a 400
  # UnsupportedParamsError. Models that DO support it (gpt-5.6 trio) are
  # unaffected; models where it's a no-op (claude-*) still accept it as before.
  drop_params: true

# Optional: Database for logging and tracking
# litellm_settings:
#   success_callback: ["langfuse"]
#   failure_callback: ["langfuse"]
