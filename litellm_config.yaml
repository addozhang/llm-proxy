# General settings
general_settings:
  # Master key for authentication
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # Database connection for virtual keys
  database_url: os.environ/DATABASE_URL
  
  # Logging
  log_level: INFO
  
  # Request timeout in seconds
  request_timeout: 600
  
  # Enable detailed logging
  set_verbose: false
  
  # Cache settings (optional)
  cache: false
  
  # Enable model fallbacks
  enable_fallbacks: true

# Router settings
router_settings:
  routing_strategy: simple-shuffle
  
  # Rate limiting (requests per minute per model)
  rpm_limit: 100
  
  # Cooldown time after rate limit in seconds
  cooldown_time: 60

# Optional: Database for logging and tracking
# litellm_settings:
#   success_callback: ["langfuse"]
#   failure_callback: ["langfuse"]
